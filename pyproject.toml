[project]
name = "demand-forecast"
version = "0.1.0"
description = "GB national electricity demand forecasting (1h / 24h / 7d) with weather features"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "requests>=2.32",
    "pyyaml>=6",
    "matplotlib>=3.9",
    "holidays>=0.105",
    "xgboost>=3.4.1",
    "tabulate>=0.9",
]

[project.optional-dependencies]
# Prophet and TFT are only needed to re-run the research backtests.
research = [
    "prophet>=1.4.0",
    "darts[torch]>=0.47.0",
]
# API + dashboard (what the Docker image installs).
serve = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "streamlit>=1.40",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ipykernel>=6.29",
    "nbformat>=5.10",
    "nbconvert>=7.16",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demand_forecast"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
