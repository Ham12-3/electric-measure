[project]
name = "demand-forecast"
version = "0.1.0"
description = "GB national electricity demand forecasting (1h / 24h / 7d) with weather features"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "requests>=2.32",
    "pyyaml>=6",
    "matplotlib>=3.9",
    "holidays>=0.105",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ipykernel>=6.29",
    "nbformat>=5.10",
    "nbconvert>=7.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demand_forecast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
